[workspace]
resolver = "2"
members = [
    "src/core/neuxdot-core",
    "src/core/neuxdot-server",
    "src/apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NeuxDOT Team"]
license = "MIT"
repository = "https://github.com/NeuxDOT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
argon2 = "0.5"
rand = "0.8"
# rustls instead of native-tls: keeps OpenSSL out of the tree so the
# desktop crate cross-compiles for Android (no OpenSSL for android targets).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = { version = "0.4" }
jsonwebtoken = "9.3"
futures-util = "0.3"
async-trait = "0.1"
regex = "1.10"
