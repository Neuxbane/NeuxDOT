[package]
name = "chat-mcp"
version = "2.0.0"
edition = "2021"
authors = ["NeuxDOT Team"]
description = "Built-in binary stdio MCP chat plugin and interactive chat console"

[workspace]

[[bin]]
name = "chat"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
