[package]
name = "discord-mcp"
version = "0.1.0"
edition = "2024"
description = "Discord MCP server — per-agent configuration, REST tools and a live Gateway message stream"
license = "MIT"

[workspace]

[[bin]]
name = "discord"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.2.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "signal", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "webpki-roots", "gzip", "http2", "charset", "system-proxy"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
