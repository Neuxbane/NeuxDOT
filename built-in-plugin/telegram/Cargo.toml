[package]
name = "telegram-mcp"
version = "0.1.0"
edition = "2024"
description = "Telegram Bot API MCP server — per-agent configuration and live update streaming"
license = "MIT"

[workspace]

[[bin]]
name = "telegram"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.2.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "webpki-roots", "gzip", "http2", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
