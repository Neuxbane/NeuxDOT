<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="100%" height="100%">
  <defs>
    <style>
      .outer-stroke {
        stroke: #000000;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .inner-stroke {
        stroke: #000000;
        stroke-width: 8.5;
        stroke-linecap: round;
        stroke-linejoin: round;
