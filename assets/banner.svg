<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="40%" stop-color="#0D0E15"/>
      <stop offset="100%" stop-color="#140E1E"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="neuxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6090"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="badgePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="chibiAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="textAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Mascot Styles from logo.svg -->
    <style>
      .outer-stroke {
        stroke: #18181B;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .inner-stroke {
        stroke: #18181B;
        stroke-width: 8.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .face-stroke {
        stroke: #18181B;
        stroke-width: 7.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hair-base    { fill: #F8FAFC; }
      .hair-shadow  { fill: #CBD5E1; }
      .hair-dark    { fill: #18181B; }
      .skin-base    { fill: #FFE4D6; }
      .skin-shadow  { fill: #F5C6B3; }
      .blush        { fill: #FDA4AF; opacity: 0.85; }
      .eye-white    { fill: #FFFFFF; }
      .eye-shadow   { fill: #E2E8F0; }
      .horn-base    { fill: #FFFFFF; }
      .horn-shadow  { fill: #CBD5E1; }
      .none         { fill: none; }

      .kawaii-sparkle { fill: #FDF2F8; }
      .kawaii-gold    { fill: #FDE047; }
      .kawaii-cyan    { fill: #67E8F9; }
      .kawaii-pink    { fill: #F472B6; }
    </style>
  </defs>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <!-- Outer Rounded Card -->
  <rect x="2" y="2" width="1196" height="416" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Decorative Cyber Grid -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="6,6"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="6,6"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="6,6"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="6,6"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="6,6"/>

    <line x1="150" y1="0" x2="150" y2="420" stroke-dasharray="6,6"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke-dasharray="6,6"/>
    <line x1="450" y1="0" x2="450" y2="420" stroke-dasharray="6,6"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke-dasharray="6,6"/>
    <line x1="750" y1="0" x2="750" y2="420" stroke-dasharray="6,6"/>
    <line x1="900" y1="0" x2="900" y2="420" stroke-dasharray="6,6"/>
    <line x1="1050" y1="0" x2="1050" y2="420" stroke-dasharray="6,6"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="210" cy="210" r="230" fill="url(#chibiAura)" />
  <circle cx="820" cy="180" r="300" fill="url(#textAura)" />
  <circle cx="1100" cy="320" r="200" fill="url(#cyanAura)" />

  <!-- ================= FLOATING KAWAII PARTICLES & SAKURA ================= -->
  <!-- Floating Sakura Petals -->
  <g opacity="0.75">
    <!-- Petal 1 -->
    <path d="M 120,60 C 130,50 145,55 142,70 C 138,82 122,88 116,80 C 112,74 114,66 120,60 Z" fill="#FDA4AF" transform="rotate(15 120 60)"/>
    <!-- Petal 2 -->
    <path d="M 400,45 C 412,38 424,44 420,56 C 415,66 400,72 395,64 C 390,58 394,49 400,45 Z" fill="#F472B6" transform="rotate(-20 400 45)"/>
    <!-- Petal 3 -->
    <path d="M 1120,95 C 1130,85 1144,92 1140,104 C 1135,114 1120,120 1114,112 C 1110,105 1114,98 1120,95 Z" fill="#FDA4AF" transform="rotate(35 1120 95)"/>
    <!-- Petal 4 -->
    <path d="M 680,360 C 690,352 702,356 698,368 C 694,378 682,382 676,375 C 672,369 675,362 680,360 Z" fill="#FDA4AF" transform="rotate(-10 680 360)"/>
    <!-- Petal 5 -->
    <path d="M 1030,365 C 1042,358 1054,364 1050,376 C 1045,386 1030,392 1024,384 C 1020,378 1023,370 1030,365 Z" fill="#F472B6" transform="rotate(25 1030 365)"/>
  </g>

  <!-- Sparkles (4-pointed Kawaii Stars) -->
  <g filter="url(#softGlow)">
    <!-- Big Sparkle Top Left -->
    <path d="M 85,110 Q 85,125 70,125 Q 85,125 85,140 Q 85,125 100,125 Q 85,125 85,110 Z" class="kawaii-sparkle" />
    <!-- Pink Sparkle near mascot -->
    <path d="M 365,85 Q 365,95 355,95 Q 365,95 365,105 Q 365,95 375,95 Q 365,95 365,85 Z" class="kawaii-pink" />
    <!-- Gold Sparkle over Title -->
    <path d="M 505,80 Q 505,94 491,94 Q 505,94 505,108 Q 505,94 519,94 Q 505,94 505,80 Z" class="kawaii-gold" />
    <!-- Cyan Sparkle Mid Banner -->
    <path d="M 1080,160 Q 1080,172 1068,172 Q 1080,172 1080,184 Q 1080,172 1092,172 Q 1080,172 1080,160 Z" class="kawaii-cyan" />
    <!-- Small Pink Sparkle Bottom Right -->
    <path d="M 1135,275 Q 1135,283 1127,283 Q 1135,283 1135,291 Q 1135,283 1143,283 Q 1135,283 1135,275 Z" class="kawaii-pink" />
    <!-- Tiny Sparkle bottom left -->
    <path d="M 330,345 Q 330,353 322,353 Q 330,353 330,361 Q 330,353 338,353 Q 330,353 330,345 Z" class="kawaii-sparkle" />
  </g>

  <!-- Kawaii Cross Sparkles (+) -->
  <g stroke="#FDF2F8" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="260" x2="70" y2="260" />
    <line x1="65" y1="255" x2="65" y2="265" />

    <line x1="435" y1="230" x2="445" y2="230" />
    <line x1="440" y1="225" x2="440" y2="235" />

    <line x1="1140" y1="65" x2="1150" y2="65" />
    <line x1="1145" y1="60" x2="1145" y2="70" />

    <line x1="970" y1="380" x2="980" y2="380" />
    <line x1="975" y1="375" x2="975" y2="385" />
  </g>

  <!-- ================= MASCOT SECTION (LEFT) ================= -->
  <!-- Scaled and positioned chibi mascot from logo.svg -->
  <g transform="translate(-105, -5) scale(0.92)" filter="url(#dropShadow)">
    <!-- Inner Dark Bob Layer -->
    <path class="outer-stroke hair-dark" d="
      M 285,220
      C 265,285 280,358 338,385
      C 358,394 378,385 382,368
      C 358,350 348,310 352,265
      L 468,265
      C 472,310 462,350 438,368
      C 442,385 462,394 482,385
      C 540,358 555,285 535,220
      Z
    " />

    <!-- Main Fluffy Hair Canopy & Side Locks -->
    <path class="hair-base" d="
      M 410,65
      C 332,65 282,102 268,152
      C 232,158 202,172 188,188
      C 210,204 242,208 266,202
      C 246,248 248,318 282,362
      C 286,342 292,322 300,305
      C 298,332 308,358 328,374
      C 318,335 318,285 326,235
      L 494,235
      C 502,285 502,335 492,374
      C 512,358 522,332 520,305
      C 528,322 534,342 538,362
      C 572,318 574,248 554,202
      C 578,208 610,204 632,188
      C 618,172 588,158 552,152
      C 538,102 488,65 410,65
      Z
