  <!-- ================= RIGHT HERO CONTENT & TYPOGRAPHY ================= -->
  <g transform="translate(470, 0)">
    <!-- Top Kawaii Pill Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="410" height="34" rx="17" fill="url(#badgePillGrad)" stroke="#EC4899" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="20" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F472B6" letter-spacing="1.5">
        🌸 CACHE-INVARIANT • MCP RUNTIME ✦
      </text>
      <circle cx="388" cy="17" r="4" fill="#38BDF8" filter="url(#softGlow)"/>
    </g>

    <!-- Main Typographic Brand Title -->
    <g transform="translate(0, 155)">
      <!-- Drop Shadow Behind Text -->
      <text x="0" y="0" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="900" letter-spacing="-2" fill="#000000" opacity="0.6" dx="0" dy="6">
        Neux<tspan fill="#000000">DOT</tspan>
      </text>

      <!-- Main "Neux" Text in Crystalline Silver Gradient -->
      <text x="0" y="0" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="900" letter-spacing="-2" fill="url(#neuxGrad)">
        Neux
      </text>

      <!-- "DOT" Text in Cyber Kawaii Neon Gradient with Glow -->
      <text x="238" y="0" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="900" letter-spacing="-1" fill="url(#dotGrad)" filter="url(#pinkGlow)">
        DOT
      </text>

      <!-- Kawaii Sparkle over the letter 'O' -->
      <path d="M 334,-38 Q 334,-30 326,-30 Q 334,-30 334,-22 Q 334,-30 342,-30 Q 334,-30 334,-38 Z" fill="#FFFFFF" />

      <!-- Glowing Neon Cyber Dot at end -->
      <circle cx="438" cy="-8" r="9" fill="#F43F5E" filter="url(#pinkGlow)"/>
      <circle cx="438" cy="-8" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Mascot Speech Quote Bubble -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="560" height="42" rx="14" fill="#18181B" fill-opacity="0.85" stroke="#3F3F46" stroke-width="1.2" />
      <text x="18" y="26" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="500" fill="#E2E8F0">
        <tspan fill="#F472B6">(｡•̀ᴗ-)✧</tspan> <tspan fill="#A5F3FC">"Zero-trust determinism</tspan> <tspan fill="#E2E8F0">never looked so</tspan> <tspan fill="#F472B6" font-weight="700">kawaii!"</tspan> <tspan fill="#FDE047">✨</tspan>
      </text>
    </g>

    <!-- Subtitle Description -->
    <text x="2" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Zero-trust agent kernel with invariant meta-tools &amp; unprompted WASM events.
    </text>

    <!-- Interactive Glowing Feature Pills Row -->
    <g transform="translate(0, 296)">
      <!-- Pill 1: Cache Invariance -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="38" rx="10" fill="url(#chipGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#C7D2FE">
          ⚡ Cache-Invariant
        </text>
      </g>

      <!-- Pill 2: 9 Invariant Meta-Tools -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="168" height="38" rx="10" fill="url(#chipGrad)" stroke="#EC4899" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBCFE8">
          🛡️ 9 Meta-Tools
        </text>
      </g>

      <!-- Pill 3: WASM Sandbox -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="155" height="38" rx="10" fill="url(#chipGrad)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E9D5FF">
          🧩 WASM Sandbox
        </text>
      </g>

      <!-- Pill 4: Push Events -->
      <g transform="translate(527, 0)">
        <rect x="0" y="0" width="145" height="38" rx="10" fill="url(#chipGrad)" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.6"/>
        <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#BAE6FD">
          🌸 Push Events
        </text>
      </g>
    </g>

    <!-- Bottom Tiny Kawaii Footer Flourish -->
    <g transform="translate(4, 370)">
      <text font-family="'Fira Code', monospace" font-size="11" fill="#64748B" letter-spacing="1">
        ✦ ✧ ✦  NEUXDOT KERNEL  •  100% DETERMINISTIC  •  OWO POWERED  ✦ ✧ ✦
      </text>
    </g>
  </g>
</svg>
