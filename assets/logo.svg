    M 188,188
    C 208,202 235,205 256,202
    C 246,188 228,178 206,176
    Z
  " />
  <path class="inner-stroke hair-dark" d="
    M 632,188
    C 612,202 585,205 564,202
    C 574,188 592,178 614,176
