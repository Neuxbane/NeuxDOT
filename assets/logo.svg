    <ellipse class="face-stroke none" cx="350" cy="256" rx="25" ry="27" />
  </g>

  <!-- Right Eye -->
  <g transform="rotate(6 470 256)">
    <ellipse class="eye-white" cx="470" cy="256" rx="25" ry="27" />
    <!-- Subtle Top Eye Shadow Crescent -->
    <path class="eye-shadow" d="
      M 446,248
      A 25,27 0 0,1 494,248
      Q 470,240 446,248
      Z
    " />
    <ellipse class="face-stroke none" cx="470" cy="256" rx="25" ry="27" />
  </g>

  <!-- Classic OwO 'w' Mouth -->
  <path class="face-stroke none" d="
    M 390,282
    C 392,293 406,293 410,283
    C 414,293 428,293 430,282
  " />

  <!-- ================= OWO BOT FLUFFY PARTED BANGS ================= -->
  <!-- Solid Silver-White Fill Mask for the Forehead Volume -->
  <path class="hair-base" d="
    M 288,175
    C 282,205 284,232 292,252
    C 298,242 305,226 314,212
    C 324,198 336,192 346,190
    C 352,206 366,232 384,242
    C 390,234 396,222 400,214
    C 404,224 407,236 410,240
    C 413,236 416,224 420,214
    C 424,222 430,234 436,242
    C 454,232 468,206 474,190
    C 484,192 496,198 506,212
    C 515,226 522,242 528,252
    C 536,232 538,205 532,175
    L 505,120
