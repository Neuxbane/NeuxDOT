  " />

  <!-- Cute Pink Oval Cheek Blushes (OwO Bot Style) -->
  <ellipse class="blush" cx="326" cy="284" rx="18" ry="11" transform="rotate(8 326 284)" />
  <ellipse class="blush" cx="494" cy="284" rx="18" ry="11" transform="rotate(-8 494 284)" />

  <!-- ================= OWO BOT BIG BLANK EYES & 'w' CAT MOUTH ================= -->
  <!-- Left Eye -->
  <g transform="rotate(-6 350 256)">
    <ellipse class="eye-white" cx="350" cy="256" rx="25" ry="27" />
    <!-- Subtle Top Eye Shadow Crescent -->
    <path class="eye-shadow" d="
      M 326,248
      A 25,27 0 0,1 374,248
      Q 350,240 326,248
      Z
