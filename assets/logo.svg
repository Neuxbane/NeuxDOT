<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="100%" height="100%">
  <defs>
    <style>
      /* Stroke Hierarchy */
      .outer-stroke {
        stroke: #18181B;
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .inner-stroke {
        stroke: #18181B;
        stroke-width: 8.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .face-stroke {
        stroke: #18181B;
        stroke-width: 7.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Flat Color Palette (No Gradients) */
      .hair-base    { fill: #F8FAFC; }
      .hair-shadow  { fill: #CBD5E1; }
      .hair-dark    { fill: #18181B; }
      .skin-base    { fill: #FFE4D6; }
      .skin-shadow  { fill: #F5C6B3; }
      .blush        { fill: #FDA4AF; opacity: 0.75; }
      .eye-white    { fill: #FFFFFF; }
      .eye-shadow   { fill: #E2E8F0; }
      .horn-base    { fill: #FFFFFF; }
      .horn-shadow  { fill: #CBD5E1; }
      .none         { fill: none; }
    </style>
  </defs>


  <!-- ================= INNER DARK BOB LAYER ================= -->
  <path class="outer-stroke hair-dark" d="
    M 285,220
    C 265,285 280,358 338,385
    C 358,394 378,385 382,368
    C 358,350 348,310 352,265
    L 468,265
    C 472,310 462,350 438,368
    C 442,385 462,394 482,385
    C 540,358 555,285 535,220
    Z
  " />

