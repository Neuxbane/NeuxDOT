  " />

  <!-- Main Hair Outer Stroke -->
  <path class="outer-stroke none" d="
    M 410,65
    C 332,65 282,102 268,152
    C 232,158 202,172 188,188
    C 210,204 242,208 266,202
    C 246,248 248,318 282,362
    C 286,342 292,322 300,305
    C 298,332 308,358 328,374
    C 318,335 318,285 326,235
    L 494,235
    C 502,285 502,335 492,374
    C 512,358 522,332 520,305
    C 528,322 534,342 538,362
    C 572,318 574,248 554,202
    C 578,208 610,204 632,188
    C 618,172 588,158 552,152
    C 538,102 488,65 410,65
