  " />
  <path class="hair-shadow" d="
    M 384,242 C 390,234 396,222 400,214 C 394,224 388,234 384,242 Z
  " />
  <path class="hair-shadow" d="
    M 410,240 C 413,236 416,224 420,214 C 416,224 413,234 410,240 Z
  " />
  <path class="hair-shadow" d="
