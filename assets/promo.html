<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuxDOT — 3D Kinetic Motion Promo</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script src="three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07080D;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      color: #FFFFFF;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Cinematic Vignette & Grain */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 40%, rgba(5, 6, 10, 0.75) 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
    }
    /* Kinetic Overlay Container */
    #kinetic-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 60px;
    }
    /* Top Header Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(236, 72, 153, 0.4);
      padding: 4px;
      backdrop-filter: blur(8px);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 60%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.5);
      color: #F472B6;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.2);
    }
    /* Kinetic Typography Stage */
    .kinetic-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      max-width: 900px;
      perspective: 1000px;
    }
    .kinetic-tag {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #38BDF8;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kinetic-headline {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(30px) rotateX(-10deg);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .kinetic-headline span.highlight {
      background: linear-gradient(135deg, #F43F5E 0%, #EC4899 50%, #A855F7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    .kinetic-desc {
      font-size: 18px;
      font-weight: 500;
      color: #94A3B8;
      line-height: 1.5;
      max-width: 680px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }
    .active .kinetic-tag,
    .active .kinetic-headline,
    .active .kinetic-desc {
      opacity: 1;
      transform: translateY(0) rotateX(0deg);
    }
    /* Bottom Controls */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }
    .timeline-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 9999px;
    }
    .btn-play {
      background: #EC4899;
      border: none;
      color: #FFFFFF;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
      transition: transform 0.15s ease;
    }
    .btn-play:hover {
      transform: scale(1.08);
    }
    .time-label {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      min-width: 80px;
    }
    .beat-indicators {
      display: flex;
      gap: 6px;
    }
    .beat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .beat-dot.active {
      background: #EC4899;
      box-shadow: 0 0 10px #EC4899;
      transform: scale(1.3);
    }
    .action-group {
      display: flex;
      gap: 12px;
    }
    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #EC4899;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>

  <!-- WebGL 3D Canvas -->
  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <!-- HTML Kinetic Typography & HUD Overlay -->
  <div id="kinetic-overlay">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="NeuxDOT">
        <div class="brand-title">NeuxDOT</div>
      </div>
      <div class="badge-pill">
        ✨ 3D Kinetic Motion Showcase
      </div>
    </div>

    <!-- Dynamic Kinetic Stage -->
    <div class="kinetic-stage" id="stage">
      <div class="kinetic-tag" id="tag">THE PROBLEM</div>
      <div class="kinetic-headline" id="headline">
        Tired of Prompt <span class="highlight">Cache Misses?</span>
      </div>
      <div class="kinetic-desc" id="desc">
        Traditional agent frameworks break LLM prompt prefix caches on every turn, causing latency spikes and massive token bills.
      </div>
    </div>

    <!-- Bottom Controls & Timeline -->
    <div class="bottom-bar">
      <div class="timeline-container">
        <button class="btn-play" id="btn-toggle">▶</button>
        <span class="time-label" id="time-display">00:00 / 00:43</span>
        <div class="beat-indicators" id="beat-dots">
          <div class="beat-dot active" data-beat="0"></div>
          <div class="beat-dot" data-beat="1"></div>
          <div class="beat-dot" data-beat="2"></div>
          <div class="beat-dot" data-beat="3"></div>
          <div class="beat-dot" data-beat="4"></div>
        </div>
      </div>

      <div class="action-group">
        <button class="glass-btn" id="btn-mode">🎥 Free 3D Orbit</button>
        <a class="glass-btn" href="showcase.mp4" download="NeuxDOT_Promo.mp4">⬇️ Download Video</a>
      </div>
    </div>
  </div>

  <script>
    // ================= THREE.JS 3D SCENE SETUP =================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07080D, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // ================= LIGHTING =================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xec4899, 2.5);
    keyLight.position.set(5, 8, 4);
    scene.add(keyLight);

    const cyanLight = new THREE.PointLight(0x06b6d4, 3, 15);
    cyanLight.position.set(-4, -1, 3);
    scene.add(cyanLight);

    const purpLight = new THREE.PointLight(0x8b5cf6, 4, 15);
    purpLight.position.set(3, -2, -2);
    scene.add(purpLight);

    // ================= 3D CYBER GRID FLOOR =================
    const gridHelper = new THREE.GridHelper(30, 60, 0xec4899, 0x1e1b4b);
    gridHelper.position.y = -1.8;
    scene.add(gridHelper);

    // ================= 3D FLOATING DESKTOP APP WINDOW =================
    const textureLoader = new THREE.TextureLoader();
    const appTexture = textureLoader.load('1.png');
    appTexture.generateMipmaps = true;
    appTexture.minFilter = THREE.LinearMipmapLinearFilter;

    // Window Glass Panel (Slab)
    const windowGeometry = new THREE.BoxGeometry(4.4, 2.22, 0.05);
    const windowMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.8, roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.8, roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.8, roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.8, roughness: 0.2 }),
      new THREE.MeshStandardMaterial({ map: appTexture, roughness: 0.15, metalness: 0.1 }), // Front face
      new THREE.MeshStandardMaterial({ color: 0x09090b, metalness: 0.9, roughness: 0.1 })  // Back face
    ];
    const appWindow = new THREE.Mesh(windowGeometry, windowMaterials);
    appWindow.position.set(0.6, 0.2, 0);
    appWindow.rotation.set(0.2, -0.35, 0.05);
    scene.add(appWindow);

    // Floating Glowing Rim Frame around the App Window
    const frameGeo = new THREE.BoxGeometry(4.45, 2.27, 0.06);
    const frameMat = new THREE.MeshBasicMaterial({ color: 0xec4899, wireframe: true, opacity: 0.4, transparent: true });
    const wireFrame = new THREE.Mesh(frameGeo, frameMat);
    appWindow.add(wireFrame);

    // ================= 3D HOLOGRAPHIC CHIBI MASCOT EMBLEM =================
    const mascotTexture = textureLoader.load('mascot_texture.png');
    const mascotGeo = new THREE.PlaneGeometry(1.4, 1.4);
    const mascotMat = new THREE.MeshBasicMaterial({ map: mascotTexture, transparent: true, side: THREE.DoubleSide });
    const mascotMesh = new THREE.Mesh(mascotGeo, mascotMat);
    mascotMesh.position.set(-2.2, 0.5, 0.8);
    mascotMesh.rotation.y = 0.3;
    scene.add(mascotMesh);

    // Glowing Neon Ring around Mascot
    const ringGeo = new THREE.TorusGeometry(0.85, 0.02, 16, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    mascotMesh.add(ringMesh);

    // ================= 9 INVARIANT META-TOOL ORBITING CHIPS =================
    const toolsGroup = new THREE.Group();
    scene.add(toolsGroup);
    toolsGroup.position.set(0, 0, 0);

    const toolNames = ['search_tools', 'get_tool_schema', 'call_tool', 'list_servers', 'setMemory', 'editMemory', 'readMemory', 'compact', 'sleep'];
    const toolChips = [];

    for (let i = 0; i < 9; i++) {
      const chipGeo = new THREE.BoxGeometry(0.5, 0.25, 0.02);
      const chipMat = new THREE.MeshStandardMaterial({
        color: 0x1e1b4b,
        emissive: i % 2 === 0 ? 0xec4899 : 0x8b5cf6,
        emissiveIntensity: 0.3,
        roughness: 0.2
      });
      const chip = new THREE.Mesh(chipGeo, chipMat);
      const angle = (i / 9) * Math.PI * 2;
      const radius = 2.8;
      chip.position.set(Math.cos(angle) * radius, Math.sin(angle) * 0.8 - 0.2, Math.sin(angle) * radius * 0.6);
      chip.rotation.y = -angle;
      toolsGroup.add(chip);
      toolChips.push(chip);
    }

    // ================= PARTICLE STARFIELD =================
    const particleCount = 600;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 20;
      positions[i + 1] = (Math.random() - 0.5) * 12;
      positions[i + 2] = (Math.random() - 0.5) * 15;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xf472b6,
      size: 0.04,
      transparent: true,
      opacity: 0.6
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // ================= KINETIC SCRIPT & BEATS =================
    const beats = [
      {
        time: 0,
        tag: "THE PROBLEM",
        headline: "Tired of Prompt <span class='highlight'>Cache Misses?</span>",
        desc: "Traditional frameworks dump volatile tool schemas into every prompt, breaking prefix caches and driving up latency and costs.",
        camPos: [0, 0.8, 5.2],
        camLook: [0.2, 0.2, 0],
        windowRot: [0.2, -0.35, 0.05],
        windowPos: [0.6, 0.2, 0]
      },
      {
        time: 8.0,
        tag: "THE NEUXDOT PARADIGM",
        headline: "100% Invariant. <span class='highlight'>Zero Cache Misses.</span>",
        desc: "Your system prompt stays completely frozen. Nine immutable meta-tools fetch schemas on-demand with 100% cache hits across all turns.",
        camPos: [-1.2, 1.8, 4.5],
        camLook: [0.2, 0, 0],
        windowRot: [0.35, -0.2, 0.1],
        windowPos: [0.4, 0.1, 0]
      },
      {
        time: 19.5,
        tag: "ZERO-TRUST SANDBOX",
        headline: "Sandboxed <span class='highlight'>WASM Extensions.</span>",
        desc: "Run isolated WebAssembly extensions via Wasmtime with host-managed Key-Value storage, zero prompt leakage, and automated data migration.",
        camPos: [1.8, 0.4, 3.8],
        camLook: [0.6, 0.2, 0],
        windowRot: [0.1, -0.5, 0],
        windowPos: [0.8, 0.3, 0]
      },
      {
        time: 29.0,
        tag: "REALTIME STREAMING",
        headline: "Unprompted Push. <span class='highlight'>Single-Timer Sleep.</span>",
        desc: "True asynchronous MCP push subscriptions wake sleeping agents deterministically with instant event notification envelopes.",
        camPos: [0, -0.2, 3.4],
        camLook: [0.3, 0.1, 0],
        windowRot: [0.05, -0.15, 0],
        windowPos: [0.3, 0.1, 0]
      },
      {
        time: 35.5,
        tag: "OWO KERNEL",
        headline: "Determinism Never Looked <span class='highlight'>So Kawaii.</span>",
        desc: "Build next-generation autonomous agents with maximum cache speed and zero-trust security. Open source and MIT licensed.",
        camPos: [-0.5, 0.6, 4.8],
        camLook: [-0.4, 0.4, 0],
        windowRot: [0.15, -0.25, 0.05],
        windowPos: [0.5, 0.2, 0]
      }
    ];

    let currentBeatIndex = 0;
    let isPlaying = true;
    let freeOrbit = false;
    let currentTime = 0;
    const totalDuration = 43.0;

    const stageEl = document.getElementById('stage');
    const tagEl = document.getElementById('tag');
    const headlineEl = document.getElementById('headline');
    const descEl = document.getElementById('desc');
    const timeDisplay = document.getElementById('time-display');
    const btnToggle = document.getElementById('btn-toggle');
    const beatDots = document.querySelectorAll('.beat-dot');

    function setBeat(index) {
      currentBeatIndex = index;
      const beat = beats[index];
      stageEl.classList.remove('active');
      setTimeout(() => {
        tagEl.innerHTML = beat.tag;
        headlineEl.innerHTML = beat.headline;
        descEl.innerHTML = beat.desc;
        stageEl.classList.add('active');
      }, 150);

      beatDots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    setBeat(0);

    // ================= AUDIO PLAYBACK =================
    // Web Audio Synthesizer BGM + SFX
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    // Toggle Play/Pause
    btnToggle.addEventListener('click', () => {
      initAudio();
      isPlaying = !isPlaying;
      btnToggle.innerHTML = isPlaying ? '❚❚' : '▶';
    });

    // Toggle Free Orbit Mode
    const btnMode = document.getElementById('btn-mode');
    btnMode.addEventListener('click', () => {
      freeOrbit = !freeOrbit;
      btnMode.innerHTML = freeOrbit ? '🎬 Director Cam' : '🎥 Free 3D Orbit';
    });

    // Click on beat dots to scrub
    beatDots.forEach(dot => {
      dot.addEventListener('click', () => {
        const beatIdx = parseInt(dot.getAttribute('data-beat'));
        currentTime = beats[beatIdx].time;
        setBeat(beatIdx);
      });
    });

    // Mouse Interaction for parallax / orbit
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // ================= ANIMATION RENDER LOOP =================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= totalDuration) {
          currentTime = 0;
        }

        // Format time string
        const curM = Math.floor(currentTime / 60).toString().padStart(2, '0');
        const curS = Math.floor(currentTime % 60).toString().padStart(2, '0');
        const totM = Math.floor(totalDuration / 60).toString().padStart(2, '0');
        const totS = Math.floor(totalDuration % 60).toString().padStart(2, '0');
        timeDisplay.innerText = `${curM}:${curS} / ${totM}:${totS}`;

        // Check beat triggers
        for (let i = beats.length - 1; i >= 0; i--) {
          if (currentTime >= beats[i].time) {
            if (currentBeatIndex !== i) {
              setBeat(i);
            }
            break;
          }
        }
      }

      // Floating gentle motion
      const t = clock.getElapsedTime();
      appWindow.position.y += Math.sin(t * 1.5) * 0.0015;
      mascotMesh.position.y += Math.cos(t * 2.0) * 0.002;
      ringMesh.rotation.z += 0.015;

      // Orbiting tool chips
      toolsGroup.rotation.y = t * 0.25;

      // Camera lerp
      if (!freeOrbit) {
        const targetBeat = beats[currentBeatIndex];
        const targetCamX = targetBeat.camPos[0] + mouseX * 0.3;
        const targetCamY = targetBeat.camPos[1] - mouseY * 0.3;
        const targetCamZ = targetBeat.camPos[2];

        camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.04);
        camera.lookAt(targetBeat.camLook[0], targetBeat.camLook[1], targetBeat.camLook[2]);

        // Window lerp
        appWindow.rotation.x = THREE.MathUtils.lerp(appWindow.rotation.x, targetBeat.windowRot[0], 0.05);
        appWindow.rotation.y = THREE.MathUtils.lerp(appWindow.rotation.y, targetBeat.windowRot[1] + mouseX * 0.1, 0.05);
        appWindow.position.x = THREE.MathUtils.lerp(appWindow.position.x, targetBeat.windowPos[0], 0.05);
      } else {
        camera.position.x = Math.sin(t * 0.3) * 5;
        camera.position.z = Math.cos(t * 0.3) * 5;
        camera.position.y = 1.2 + mouseY * 2;
        camera.lookAt(0, 0, 0);
      }

      // Cyber Grid pulse
      gridHelper.position.z = (t * 0.6) % 1;

      renderer.render(scene, camera);
    }

    animate();

    // Responsive Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
